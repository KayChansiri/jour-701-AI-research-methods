site_name: Research Methods in the Age of AI
site_description: Graduate research methods for an AI-mediated world
site_author: Kay Chansiri

site_url: https://kaychansiri.github.io/research-methods-in-the-age-of-ai/

repo_name: KayChansiri/research-methods-in-the-age-of-ai
repo_url: https://github.com/KayChansiri/research-methods-in-the-age-of-ai

theme:
  name: material
  language: en

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  icon:
    logo: material/school
    repo: fontawesome/brands/github

nav:
  - Home: index.md

  - Syllabus:
      - Course Overview: syllabus.md
      - Weekly Schedule: schedule.md
      - AI Use Policy: ai-policy.md

  - Lectures:
      - Lecture Materials: lectures/index.md

  - Labs & Codebooks:
      - Overview: labs/index.md
      - Week 3 — Python Research Workflow: labs/week-03-python.md
      - Week 4 — Human + AI Literature Screening: labs/week-04-python.md

  - Assignments:
      - Assignment Overview: assignments/index.md

  - Resources:
      - Course Resources: resources/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KayChansiri

copyright: >
  Copyright © 2026 Kay Chansiri.
  Course materials may not be redistributed without permission.
